- id: 2602.00018v1
  title: 'Beyond Function Equivalence: Method-Equivalence Verification for AI Coding
    Agents and the Explosion of Enterprise Defect Surface'
  authors:
  - Iyer
  - Rajesh
  date: '2026-02-25'
  category: ai-systems
  slug: beyond-function-equivalence-method-equivalence-verification-
  abstract: 'Abstract. AI coding agents deliver on two of the three enterprise KPIs:
    velocity and cost. GPT-5.3-Codex reaches 56.8% on SWE-Bench Pro and 77.3% on Terminal-Bench
    2.0 [3]; Claude Code crossed $1B in annualized revenue within six months [13].
    Yet even the velocity claim is fragile: METR’s randomized controlled trial found
    that experienced developers using AI tools were 19% slower, yet believed they
    were 20% faster [15]. The third KPI—quality, measured by defects—is moving in
    the wrong direction, invisibly. These agents are evaluated on function equivalence:
    whether a patch makes tests pass. They are not evaluated on method equivalence:
    whether the computational approach, algorithmic contract, and structural properties
    of the code are preserved. SlopCodeBench reveals that GPT-5.3 Codex achieves 51.6%
    on core tests but only 23.7% in isolation; Claude Opus 4.6 scores 53.8% on core
    tests but only 21.5% in isolation [1]. The gap—27.9 and 32.3 percentage points—quantifies
    code that passes every quality gate the enterprise operates while manufacturing
    latent defects: god functions exceeding 954 lines, clone densities of 116–174
    duplicated lines per thousand LOC, and abstractions built then broken across successive
    edits. At enterprise scale, these invisible defects compound across interconnected
    software, data, and business estates into an explosion of defect surface that
    no dashboard currently detects. If velocity gains are illusory for experienced
    maintainers and the defect signal is hidden, we may have merely accelerated defect
    generation. We formalize the method equivalence gap, present an empirically-grounded
    four-type defect taxonomy, propose MEV (Method-Equivalence Verification)- a three-layer
    CI/CD gate - and argue, drawing on Heckman’s selection-bias framework [14], that
    enterprises must maintain airgapped human-authored baselines to prevent MEV’s
    own detection thresholds from silently recalibrating to the degraded normal.'
  pdf: beyond-function-equivalence-method-equivalence-verification-.pdf
  hash: 879bdeee5a348c12
  shortlink: method-equivalence
- id: 2602.00017v1
  title: 'The Task Horizon Illusion: Why METR’s Exponential Doesn’t Reach the Enterprise
    Data Problem'
  authors:
  - Iyer
  - Rajesh
  date: '2026-02-12'
  category: enterprise-ai
  slug: the-task-horizon-illusion-why-metr-s-exponential-doesn-t-rea
  shortlink: task-horizon
  abstract: 'METR’s time-horizon metric shows AI agents doubling their autonomous
    task-completion capability every seven months, with recent acceleration to an
    89-day doubling period. Claude Opus 4.5 reached a 50% time horizon of approximately
    5 hours in late 2025. These findings have catalyzed extraordinary claims: Sequoia
    Capital has declared “2026: This Is AGI”; Bloomberg Intelligence projects 200,000
    Wall Street job cuts; Citi estimates 54% of banking jobs are “highly automatable.”

    We reproduce the METR trendline from 16,598 raw evaluation runs across 228 tasks
    and 14 frontier models, confirming the exponential. We then demonstrate that this
    trend, while methodologically careful, systematically misrepresents the automation
    frontier in Banking, Financial Services, and Insurance (BFSI). The defining challenge
    is not task length but data breadth: the reconciliation of structured transactional
    systems with unstructured corpora under real-time consistency and regulatory audit
    requirements. We introduce the Data Unification Horizon (DUH) as a complementary
    metric, identify three load-bearing

    capabilities absent from all current AI benchmarks, and map BFSI task families
    against both dimensions. Our analysis reveals a sharp partition: low-DUH tasks
    (boilerplate generation, single-source reconciliation, rule-based screening) are
    genuinely headed for obsolescence within 18–24 months, while high-DUH tasks (complex
    underwriting, multi-party claims, KYC remediation, model validation) will resist
    time-horizon expansion indefinitely absent enterprise data infrastructure investment.
    The 200,000 jobs at risk are not writing code. They are reconciling data across
    systems that don’t talk to each other, under regulatory frameworks that demand
    auditability. The METR trendline doesn’t reach them. What reaches them is data
    unification.'
  pdf: the-task-horizon-illusion-why-metr-s-exponential-doesn-t-rea.pdf
  hash: 4405b80dad3f9063
- id: 2602.00016v1
  title: A Market-Conduct-Safe, Evidence-Anchored Decision Packet for AI-Assisted
    P&C Underwriting Design principles for auditability, adverse-action defensibility,
    and controlled discretion
  authors:
  - Belhe Ph.D.
  - Upendra
  date: '2026-02-10'
  category: enterprise-ai
  slug: a-market-conduct-safe-evidence-anchored-decision-packet-for-
  shortlink: underwriting-ai
  abstract: 'AI-assisted underwriting in regulated P&C insurance is constrained not
    by model capability, but by the inability to produce durable decision evidence
    that withstands market conduct review. Regulators audit files, not models. This
    paper proposes a Decision Packet: a standardized, auditable, replayable record
    binding underwriting outcomes to contemporaneous evidence, governing constraints,
    decision authority, and alternatives considered. We define a protocol comprising
    a

    message envelope, evidence bundle contract, decision graph, and compliance replay
    manifest. Two worked examples (Personal Lines Auto and Commercial Workers’ Compensation)
    demonstrate implementation. The proposed construct is buildable today and enables
    scalable, defensible AI-assisted underwriting in regulated environments.'
  pdf: a-market-conduct-safe-evidence-anchored-decision-packet-for-.pdf
