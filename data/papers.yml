- id: 2512.00001v1
  title: 'The Benjamin Button Problem: Ashby''s Constraint and the Agentic Enterprise'
  authors:
  - Iyer, Rajesh S
  date: '2025-12-31'
  category: ai-systems
  slug: ben_button
  shortlink: ben-button
  abstract: 'The industry tried to be born old—deploying agents before earning the
    governance  to sustain them. For eighteen months, the narrative held that LLMs
    reason like  humans, therefore agents everywhere. That story skipped the hard
    parts: governance,  credibility, institutional risk, coordination cost. Enterprises
    didn''t reject agents.  They priced them correctly. This paper argues for aging
    backwards: beginning with  GenAI-augmented automation, graduating to agentic patterns,
    and instantiating agents  only as a reward for earned governance. The theoretical
    foundation combines Ashby''s  Law of Requisite Variety with Blackman''s insight
    on stability: you cannot govern a  high-variety system with a low-variety regulator,
    and low-frequency governance cannot  stably control high-frequency agent behavior.
    Together, these constraints define a  regime boundary—below which deterministic
    governance suffices, above which agentic  governance becomes mandatory. Crucially,
    GenAI itself enables the crossing: by  augmenting governance at computational
    frequency, it solves the frequentist problem  that makes agentic governance possible.

    '
  pdf: ben_button.pdf
  hash: ''
- id: 2601.00002v1
  title: 'τDQ: Tensor Methods for Data Quality Validation in Business Intelligence
    via GPU-Accelerated Completion and Decomposition'
  authors:
  - Iyer
  - ' Rajesh'
  date: '2026-01-01'
  category: data-engineering
  slug: dq-tensor-methods-for-data-quality-validation-in-business-in
  shortlink: tau-dq
  abstract: 'We introduce τDQ (tau-DQ), a GPU-accelerated framework for detecting
    missing and potentially inaccurate data in business intelligence through tensor
    methods. Unlike conventional profiling that validates individual fields, τDQ identifies
    struc- tural anomalies in multi-dimensional relationships. Tensor completion surfaces
    gaps—expected combinations that are missing from the data. Tensor decomposition
    flags suspicious values—records that exist but don’t fit the low-rank structure
    of valid busi- ness data. Together, these techniques catch data quality failures
    invisible to rule-based validation: the missing regional coverage, the transaction
    that shouldn’t exist, the KPI attribution that violates hierarchy.τDQ achieves
    25–30× speedup over Spark-RAPIDS while detecting 73% more structural defects than
    traditional approaches.'
  pdf: dq-tensor-methods-for-data-quality-validation-in-business-in.pdf
  hash: 794e557d2bff13ba
